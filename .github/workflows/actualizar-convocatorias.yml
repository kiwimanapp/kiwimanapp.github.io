name: Actualizar candidatos de empleo público

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-convocatorias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar BOE y BOJA
        run: python scripts/actualizar_convocatorias.py
      - name: Guardar datos si han cambiado
        run: |
          if [[ -n "$(git status --porcelain datos/convocatorias-candidatas.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos/convocatorias-candidatas.json
            git commit -m "Actualiza candidatos de empleo público"
            git push
          else
            echo "Los datos no han cambiado."
          fi
