<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f3b">
<title>Presupuestos · Kiwiman Digital Labs</title>
<style>
:root{--navy:#0b1f3b;--blue:#267de5;--teal:#00b99b;--bg:#f5f8fb;--card:#fff;--tx:#14243a;--muted:#607187;--line:#dce5ed;--warn:#fff3cd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--navy);color:white;padding:15px max(16px,calc((100% - 760px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:17px}header button{background:transparent;color:white;border:1px solid #ffffff66;border-radius:9px;padding:9px 12px}main{max-width:760px;margin:auto;padding:18px 15px 70px}h1{font-size:25px;margin:8px 0}h2{font-size:20px;margin:8px 0 14px}p{line-height:1.5}.muted{color:var(--muted);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #10243a08}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #cbd7e2;border-radius:9px;background:white;color:#14243a;padding:12px;font:inherit;min-height:46px}textarea{resize:vertical}input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #267de555;outline-offset:1px}.btn{display:block;width:100%;border:0;border-radius:11px;background:var(--blue);color:white;font:inherit;font-weight:700;padding:14px;margin:9px 0;min-height:49px}.btn.green{background:var(--teal);color:#052d2a}.btn.light{background:#e9f0f6;color:var(--navy)}.btn.danger{background:#a72c2c}.btn.small{padding:9px;font-size:14px;min-height:40px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row{display:grid;grid-template-columns:minmax(0,1fr) 76px 110px 40px;gap:6px;align-items:center;margin:8px 0}.row input{min-width:0;padding:9px;font-size:14px}.row button{height:42px;border:0;border-radius:8px;background:#fbe9e9;color:#8c2020}.total{display:flex;justify-content:space-between;padding:5px 0}.total.final{font-size:20px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}.pill{display:inline-block;background:#e8eef5;border-radius:20px;padding:4px 9px;font-size:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px}.item button{border:0;background:transparent;text-align:left;color:inherit;font:inherit;padding:5px}.warning{background:var(--warn);padding:10px;border-radius:9px;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.brand{text-align:center;color:var(--muted);font-size:12px;margin:25px 0}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:white;border-radius:20px;padding:8px 12px}.tabs button.active{background:var(--navy);color:white}.doc{background:white;color:#111;padding:25px;border:1px solid #ddd;border-radius:5px;font-size:13px}.doc table{width:100%;border-collapse:collapse;margin:18px 0}.doc th{text-align:left;border-bottom:2px solid #123;padding:8px 4px}.doc td{border-bottom:1px solid #ddd;padding:8px 4px}.right{text-align:right}.empty{text-align:center;padding:22px;color:var(--muted)}@media(max-width:480px){.row{grid-template-columns:minmax(0,1fr) 58px 88px 34px;gap:4px}.row input{font-size:13px;padding:8px}.grid{grid-template-columns:1fr}.doc{padding:14px;font-size:12px}}@media print{body{background:white}header,main>.no-print,.no-print{display:none!important}main{padding:0;max-width:none}.doc{border:0;padding:0;box-shadow:none}#screen{display:none!important}#paper{display:block!important}}

/* Identidad visual y panel de control */
header{padding:12px max(16px,calc((100% - 980px)/2));min-height:70px;box-shadow:0 3px 14px #07172b22}
.brand-lockup{display:flex;align-items:center;gap:11px}
.brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#39a0ff,#1764c0);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900;box-shadow:0 5px 14px #0003}
.brand-copy{display:flex;flex-direction:column;gap:2px}
.brand-copy strong{font-size:18px;letter-spacing:.2px}
.brand-copy small{font-size:9px;letter-spacing:1.5px;color:#b8cce2;font-weight:700}
header button{font-weight:650;cursor:pointer}
main{max-width:980px;padding-top:26px}
.welcome{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:27px 30px;border-radius:20px;background:linear-gradient(115deg,#102b4d,#174b7c);color:white;box-shadow:0 10px 28px #102b4d20}
.welcome h1{font-size:clamp(25px,4vw,34px);margin:7px 0}
.welcome p{color:#d5e4f4;margin:0}
.eyebrow{font-size:10px;letter-spacing:1.6px;font-weight:800;color:#7cc5ff}
.welcome-symbol{width:76px;height:76px;flex:0 0 76px;border:1px solid #ffffff55;border-radius:24px;display:grid;place-items:center;color:#fff;font-size:42px;font-weight:900;background:#ffffff12;transform:rotate(4deg)}
.dashboard-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:18px 0}
.metric{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:0 4px 14px #10243a08}
.metric-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;font-weight:800;margin-bottom:12px}
.blue-icon{background:#e7f1ff;color:#267de5}.amber-icon{background:#fff3dc;color:#b77913}.green-icon{background:#e4f7ee;color:#188653}.teal-icon{background:#def8f4;color:#078b7c}
.metric-label{display:block;color:var(--muted);font-size:12px;line-height:1.3;min-height:31px}
.metric b{display:block;font-size:25px;letter-spacing:-.6px;margin:5px 0 1px;overflow-wrap:anywhere}
.metric small{color:#8291a2;font-size:11px}
.primary-action{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#edf5ff;border:1px solid #d6e7fa;border-radius:17px;padding:20px 23px;margin:18px 0 27px}
.primary-action h2{margin:5px 0;font-size:19px}
.primary-action p{margin:0;color:var(--muted);font-size:13px}
.primary-action .btn{width:auto;min-width:205px;margin:0}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 8px}
.section-heading h2{margin:0;font-size:19px}
.section-heading p{margin:3px 0 0}
.text-action{border:0;background:transparent;color:#176ac2;font:inherit;font-weight:700;padding:9px;cursor:pointer}
.quote-card{background:white;border:1px solid var(--line);border-radius:14px;margin:9px 0;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.quote-card:hover{border-color:#b8d2ee;box-shadow:0 5px 16px #10243a0d}
.quote-open{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border:0;background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.quote-avatar{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;background:#edf4fc;color:#276eaf;font-size:18px}
.quote-main{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.quote-main b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote-main small{font-size:11px;color:var(--muted)}
.quote-amount{font-weight:800;font-size:14px;white-space:nowrap}
.pill{font-weight:700}
.status-draft{background:#edf1f5;color:#526477}.status-sent{background:#fff2d8;color:#94620d}.status-ok{background:#e1f6e9;color:#187342}.status-no{background:#fde8e8;color:#a52d2d}
.quote-chevron{font-size:25px;color:#9aabba;line-height:1}
.quick-links{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.quick-links .btn{margin:0}
.empty-symbol{font-size:26px;color:#8da4bb;margin-bottom:7px}
.empty p{margin-bottom:0}
.brand{padding-top:12px;border-top:1px solid var(--line)}
@media(max-width:700px){main{padding:17px 13px 55px}.dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.welcome{padding:22px 19px}.welcome-symbol{width:58px;height:58px;flex-basis:58px;border-radius:18px;font-size:32px}.primary-action{align-items:stretch;flex-direction:column;padding:18px}.primary-action .btn{width:100%;min-width:0}.metric{padding:13px}.metric b{font-size:22px}}
@media(max-width:420px){.quote-open{gap:8px;padding:11px}.quote-avatar{width:32px;height:32px;flex-basis:32px}.quote-amount{font-size:12px}.quote-main b{max-width:125px}.quote-open .pill{font-size:10px;padding:4px 7px}.brand-copy small{letter-spacing:1px}}
</style></head>
<body>
<header><div class="brand-lockup"><span class="brand-mark">K</span><span class="brand-copy"><strong>Kiwiman</strong><small> DIGITAL LABS · PRESUPUESTOS</small></span></div><button id="back" class="hidden" onclick="home()">⌂ Inicio</button></header>
<main><div id="screen"></div><div id="paper" class="hidden"></div></main>
<script>
(function(){
'use strict';
var KEY='kiwiman_presupuestos_v2';
var data={company:null,quotes:[]},current=null,view='home',recognition=null;
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('No se han podido guardar los datos. Exporta una copia de seguridad y libera espacio del navegador.');return false}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.quotes)){data=d}}catch(e){alert('No se han podido leer los datos guardados. Importa una copia de seguridad si tienes una.')}}
function euros(c){return (Number(c||0)/100).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}
function cents(v){var n=Number(String(v==null?'':v).trim().replace(/\s/g,'').replace(/\.(?=\d{3}(?:\D|$))/g,'').replace(',','.'));return isFinite(n)?Math.round(n*100):0}
function money(v){return (Number(v||0)/100).toFixed(2).replace('.',',')}
function total(q){var base=0;(q.lines||[]).forEach(function(l){base+=Math.round((Number(l.qty)||0)*(Number(l.price)||0))});var iva=Math.round(base*(Number(q.iva)||0)/100);return {base:base,iva:iva,total:base+iva}}
function dateToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateText(s){if(!s)return '';var a=s.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:s}
function nextNumber(){var y=new Date().getFullYear(),n=1;data.quotes.forEach(function(q){if(String(q.number||'').indexOf(y+'-')===0)n=Math.max(n,Number(String(q.number).split('-')[1])||0)});return y+'-'+String(n).padStart(4,'0')}
function button(text,fn,cls){return '<button class="btn '+(cls||'')+'" onclick="'+fn+'">'+text+'</button>'}
function render(html){$('screen').innerHTML=html;$('back').classList.toggle('hidden',view==='home'||!data.company);$('paper').classList.add('hidden');$('screen').classList.remove('hidden')}
function home(){
view='home';
var all=data.quotes.slice();
var recent=all.slice().sort(function(a,b){return (b.updated||0)-(a.updated||0)}).slice(0,5);
var month=dateToday().slice(0,7);
var accepted=all.filter(function(q){return q.status==='Aceptado'}).length;
var pending=all.filter(function(q){return q.status==='Enviado'}).length;
var monthTotal=all.filter(function(q){return String(q.date||'').slice(0,7)===month}).reduce(function(sum,q){return sum+total(q).total},0);
var h='<section class="welcome"><div><span class="eyebrow">ESPACIO DE TRABAJO</span><h1>Tu negocio, bajo control.</h1><p>Gestiona tus presupuestos de forma sencilla y profesional.</p></div><div class="welcome-symbol">K</div></section>';
h+='<div class="dashboard-grid"><div class="metric"><span class="metric-icon blue-icon">▤</span><span class="metric-label">Presupuestos creados</span><b>'+all.length+'</b><small>En total</small></div><div class="metric"><span class="metric-icon amber-icon">◷</span><span class="metric-label">Pendientes</span><b>'+pending+'</b><small>Enviados al cliente</small></div><div class="metric"><span class="metric-icon green-icon">✓</span><span class="metric-label">Aceptados</span><b>'+accepted+'</b><small>Confirmados</small></div><div class="metric"><span class="metric-icon teal-icon">€</span><span class="metric-label">Este mes</span><b>'+euros(monthTotal)+'</b><small>Importe presupuestado</small></div></div>';
h+='<section class="primary-action"><div><span class="eyebrow">EMPIEZA AQUÍ</span><h2>¿Preparamos un presupuesto?</h2><p>Registra un nuevo trabajo y envíaselo a tu cliente.</p></div>'+button('＋ Crear presupuesto','newQuote()','green')+'</section>';
h+='<div class="section-heading"><div><h2>Actividad reciente</h2><p class="muted">Tus últimos presupuestos</p></div><button class="text-action" onclick="showHistory()">Ver historial →</button></div>';
if(!recent.length)h+='<div class="card empty"><div class="empty-symbol">▤</div><b>Aún no hay presupuestos</b><p>Cuando crees el primero, aparecerá aquí.</p></div>';
recent.forEach(function(q){h+=quoteCard(q)});
h+='<div class="quick-links">'+button('▦ Historial completo','showHistory()','light')+button('⚙ Mi empresa y ajustes','settings()','light')+'</div>';
h+='<p class="brand">Kiwiman Digital Labs · Tus datos se guardan en este dispositivo.</p>';
render(h)
}
function quoteCard(q){var t=total(q);var st=q.status||'Borrador';var cls=st==='Aceptado'?'status-ok':st==='Rechazado'?'status-no':st==='Enviado'?'status-sent':'status-draft';return '<div class="quote-card"><button class="quote-open" onclick="openQuote('+q.id+')"><span class="quote-avatar">▤</span><span class="quote-main"><b>'+esc(q.client||'Cliente sin nombre')+'</b><small>'+esc(q.number)+' · '+dateText(q.date)+'</small></span><span class="quote-amount">'+euros(t.total)+'</span><span class="pill '+cls+'">'+esc(st)+'</span><span class="quote-chevron">›</span></button></div>'}
function setup(){view='setup';var c=data.company||{};render('<h2>Datos de tu empresa</h2><p class="muted">Estos datos aparecerán en tus presupuestos. Puedes modificarlos más adelante.</p><div class="card">'+field('Nombre o razón social','co_name',c.name,'text')+field('NIF/CIF','co_tax',c.tax,'text')+field('Dirección','co_address',c.address,'text')+field('Teléfono','co_phone',c.phone,'tel')+field('Correo electrónico','co_email',c.email,'email')+'<label for="co_logo">Logotipo de la empresa (PNG, JPG o WebP; máximo 1 MB)</label><input id="co_logo" type="file" accept="image/png,image/jpeg,image/webp"><div id="logo_preview">'+(c.logo?'<img alt="Logotipo actual" src="'+c.logo+'" style="max-width:150px;max-height:75px;object-fit:contain;margin-top:8px">':'<span class="muted">Todavía no has añadido un logotipo.</span>')+'</div>'+field('IVA predeterminado (%)','co_vat',c.vat==null?21:c.vat,'number')+field('Validez predeterminada (días)','co_valid',c.valid==null?30:c.valid,'number')+'<label>Condiciones de pago</label><textarea id="co_terms" rows="3">'+esc(c.terms||'Pago a la finalización del trabajo.')+'</textarea></div>'+button('Guardar datos','saveSettings()','green'))}
function field(label,id,value,type){return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(value==null?'':value)+'">'}
function settings(){view='settings';var c=data.company||{};render('<h2>Mi empresa y ajustes</h2><div class="card">'+field('Nombre o razón social','co_name',c.name)+field('NIF/CIF','co_tax',c.tax)+field('Dirección','co_address',c.address)+field('Teléfono','co_phone',c.phone,'tel')+field('Correo electrónico','co_email',c.email,'email')+'<label for="co_logo">Logotipo de la empresa (PNG, JPG o WebP; máximo 1 MB)</label><input id="co_logo" type="file" accept="image/png,image/jpeg,image/webp"><div id="logo_preview">'+(c.logo?'<img alt="Logotipo actual" src="'+c.logo+'" style="max-width:150px;max-height:75px;object-fit:contain;margin-top:8px">':'<span class="muted">Todavía no has añadido un logotipo.</span>')+'</div>'+field('IVA predeterminado (%)','co_vat',c.vat==null?21:c.vat,'number')+field('Validez predeterminada (días)','co_valid',c.valid==null?30:c.valid,'number')+'<label>Condiciones de pago</label><textarea id="co_terms" rows="3">'+esc(c.terms||'')+'</textarea></div>'+button('Guardar cambios','saveSettings()','green')+'<h2>Copias de seguridad</h2><div class="card"><p class="muted">Exporta tus datos periódicamente. El archivo contiene datos de empresa y clientes: guárdalo en un lugar privado.</p>'+button('Exportar copia de seguridad','backup()','light')+'<label for="restore_file">Restaurar desde una copia JSON</label><input id="restore_file" type="file" accept=".json,application/json"><button class="btn light" onclick="restore()">Importar copia</button></div><div class="warning">Los datos se guardan localmente en este navegador. No se sincronizan automáticamente con otros dispositivos. Si borras los datos del navegador, podrías perderlos.</div>')}
function saveSettings(){var name=$('co_name').value.trim();if(!name){alert('Escribe el nombre de tu empresa.');return}var vat=Number($('co_vat').value);var valid=Number($('co_valid').value);if(!isFinite(vat)||vat<0||vat>100){alert('Revisa el porcentaje de IVA.');return}if(!Number.isInteger(valid)||valid<1){alert('La validez debe ser al menos un día.');return}
var previous=data.company||{};var file=$('co_logo').files[0];function finish(logo){data.company={name:name,tax:$('co_tax').value.trim(),address:$('co_address').value.trim(),phone:$('co_phone').value.trim(),email:$('co_email').value.trim(),logo:logo||'',vat:vat,valid:valid,terms:$('co_terms').value.trim()};save();home()}if(file){if(!/^image\/(png|jpeg|webp)$/.test(file.type)){alert('El logotipo debe ser PNG, JPG o WebP.');return}if(file.size>1024*1024){alert('El logotipo supera 1 MB. Elige una imagen más pequeña.');return}var reader=new FileReader();reader.onload=function(){finish(String(reader.result))};reader.onerror=function(){alert('No se pudo leer la imagen. Inténtalo de nuevo.')};reader.readAsDataURL(file)}else{finish(previous.logo||'')}}
function newQuote(){if(!data.company){setup();return}current={id:Date.now(),number:nextNumber(),date:dateToday(),client:'',clientTax:'',clientAddress:'',phone:'',description:'',lines:[{concept:'Mano de obra',qty:1,price:0},{concept:'Materiales',qty:1,price:0},{concept:'Gastos de desplazamiento',qty:1,price:0}],iva:data.company.vat,valid:data.company.valid,terms:data.company.terms,status:'Borrador',updated:Date.now()};editor()}
function openQuote(id){current=data.quotes.find(function(q){return q.id===id});if(current)editor()}
function editor(){view='editor';var q=current;var h='<h2>'+(data.quotes.some(function(x){return x.id===q.id})?'Editar':'Nuevo')+' presupuesto</h2><p class="muted">Número '+esc(q.number)+' · '+dateText(q.date)+'</p>';
h+='<div class="card"><label>Dictar descripción (opcional)</label><div class="actions"><button class="btn light small" onclick="startDictation()">🎙 Dictar</button><button class="btn light small" onclick="stopDictation()">Detener</button></div><textarea id="voice_text" rows="3" placeholder="Pulsa Dictar o escribe aquí lo que necesitas presupuestar..."></textarea><button class="btn light small" onclick="useDictation()">Añadir texto a la descripción</button><p class="muted">El dictado depende del navegador y puede requerir permiso de micrófono. Comprueba siempre el texto reconocido.</p></div>';
h+='<div class="card">'+field('Nombre del cliente','q_client',q.client)+field('NIF/CIF del cliente (opcional)','q_tax',q.clientTax)+field('Dirección del cliente (opcional)','q_address',q.clientAddress)+field('Teléfono (opcional)','q_phone',q.phone,'tel')+'<label>Descripción del trabajo</label><textarea id="q_desc" rows="3">'+esc(q.description)+'</textarea></div>';
h+='<div class="card"><h3>Conceptos e importes</h3><div class="row muted"><span>Concepto</span><span>Cant.</span><span>Precio unidad</span><span></span></div><div id="lines">';
q.lines.forEach(function(l,i){h+=lineHtml(l,i)});h+='</div><button class="btn light small" onclick="addLine()">＋ Añadir concepto</button><div class="grid">'+field('IVA (%)','q_iva',q.iva,'number')+field('Validez (días)','q_valid',q.valid,'number')+'</div><label>Condiciones</label><textarea id="q_terms" rows="2">'+esc(q.terms)+'</textarea><div id="totals">'+totalsHtml(q)+'</div></div>';
h+=button('Guardar presupuesto','saveQuote()','green')+button('Cancelar','cancelEditor()','light');render(h)}
function lineHtml(l,i){return '<div class="row"><input aria-label="Concepto" id="line_concept_'+i+'" value="'+esc(l.concept)+'"><input aria-label="Cantidad" id="line_qty_'+i+'" type="number" min="0" step="0.01" value="'+esc(l.qty)+'"><input aria-label="Precio unitario" id="line_price_'+i+'" inputmode="decimal" value="'+money(l.price)+'"><button aria-label="Eliminar concepto" onclick="removeLine('+i+')">×</button></div>'}
function readLines(){var arr=[];current.lines.forEach(function(l,i){var c=$('line_concept_'+i);if(!c)return;arr.push({concept:c.value.trim(),qty:Math.max(0,Number($('line_qty_'+i).value)||0),price:Math.max(0,cents($('line_price_'+i).value))})});return arr}
function addLine(){current.lines=readLines();current.lines.push({concept:'Nuevo concepto',qty:1,price:0});editor()}
function removeLine(i){current.lines=readLines();current.lines.splice(i,1);if(!current.lines.length)current.lines.push({concept:'Trabajo o servicio',qty:1,price:0});editor()}
function totalsHtml(q){var t=total(q);return '<div class="total"><span>Base imponible</span><b>'+euros(t.base)+'</b></div><div class="total"><span>IVA ('+Number(q.iva||0)+'%)</span><b>'+euros(t.iva)+'</b></div><div class="total final"><span>Total</span><b>'+euros(t.total)+'</b></div>'}
function saveQuote(){current.client=$('q_client').value.trim();current.clientTax=$('q_tax').value.trim();current.clientAddress=$('q_address').value.trim();current.phone=$('q_phone').value.trim();current.description=$('q_desc').value.trim();current.lines=readLines();current.iva=Number($('q_iva').value);current.valid=Number($('q_valid').value);current.terms=$('q_terms').value.trim();current.updated=Date.now();
if(!current.client){alert('Indica el nombre del cliente.');return}if(!current.description){alert('Añade una descripción del trabajo.');return}if(!current.lines.length||!current.lines.some(function(l){return l.concept&&l.qty>0&&l.price>0})){alert('Añade al menos un concepto con cantidad y precio.');return}if(!isFinite(current.iva)||current.iva<0||current.iva>100||!Number.isInteger(current.valid)||current.valid<1){alert('Revisa el IVA y los días de validez.');return}
var i=data.quotes.findIndex(function(q){return q.id===current.id});if(i>=0)data.quotes[i]=current;else data.quotes.push(current);save();preview()}
function cancelEditor(){if(confirm('¿Salir sin guardar los cambios?')){current=null;home()}}
function preview(){view='preview';var q=current,t=total(q),c=data.company;var until=new Date(q.date+'T12:00:00');until.setDate(until.getDate()+q.valid);var rows=q.lines.map(function(l){return '<tr><td>'+esc(l.concept)+'</td><td class="right">'+l.qty+'</td><td class="right">'+euros(l.price)+'</td><td class="right">'+euros(Math.round(l.qty*l.price))+'</td></tr>'}).join('');
var doc='<div class="doc"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div>'+(c.logo?'<img src="'+c.logo+'" alt="Logotipo" style="max-width:150px;max-height:75px;object-fit:contain;display:block;margin-bottom:8px">':'')+'<b style="font-size:18px">'+esc(c.name)+'</b><br>'+esc(c.tax)+'<br>'+esc(c.address)+'<br>'+esc(c.phone)+'<br>'+esc(c.email)+'</div><div class="right"><b style="font-size:19px">PRESUPUESTO</b><br>N.º '+esc(q.number)+'<br>Fecha: '+dateText(q.date)+'<br>Válido hasta: '+dateText(until.getFullYear()+'-'+String(until.getMonth()+1).padStart(2,'0')+'-'+String(until.getDate()).padStart(2,'0'))+'</div></div><hr><p><b>Cliente:</b> '+esc(q.client)+'<br>'+esc(q.clientTax)+'<br>'+esc(q.clientAddress)+'<br>'+esc(q.phone)+'</p><p>'+esc(q.description).replace(/\n/g,'<br>')+'</p><table><thead><tr><th>Concepto</th><th class="right">Cant.</th><th class="right">Precio</th><th class="right">Importe</th></tr></thead><tbody>'+rows+'</tbody></table><div class="right">Base imponible: '+euros(t.base)+'<br>IVA ('+q.iva+'%): '+euros(t.iva)+'<br><b style="font-size:17px">TOTAL: '+euros(t.total)+'</b></div><p style="margin-top:25px;font-size:11px">'+esc(q.terms)+'</p></div>';
$('screen').innerHTML='<div class="no-print"><h2>Presupuesto guardado</h2><p class="muted">Revisa el documento. Para crear un PDF, pulsa Imprimir y selecciona «Guardar como PDF» en el menú de impresión.</p><div class="actions"><button class="btn light" onclick="editCurrent()">Editar</button><button class="btn light" onclick="duplicateCurrent()">Duplicar</button></div><div class="actions"><button class="btn" onclick="printQuote()">Imprimir / PDF</button><button class="btn green" onclick="shareWhatsApp()">WhatsApp</button></div><div class="actions"><button class="btn light" onclick="shareEmail()">Correo</button><button class="btn light" onclick="showHistory()">Historial</button></div><label>Estado del presupuesto</label><select id="q_status" onchange="setStatus(this.value)">'+['Borrador','Enviado','Aceptado','Rechazado','Caducado'].map(function(s){return '<option '+(q.status===s?'selected':'')+'>'+s+'</option>'}).join('')+'</select><p class="muted">Abrir WhatsApp o el correo no significa que el mensaje se haya enviado. Cambia el estado a «Enviado» solo cuando lo hayas enviado realmente.</p></div><div id="docview">'+doc+'</div>';
$('back').classList.remove('hidden');$('paper').classList.add('hidden');}
function editCurrent(){editor()}
function duplicateCurrent(){var q=JSON.parse(JSON.stringify(current));q.id=Date.now();q.number=nextNumber();q.date=dateToday();q.status='Borrador';q.updated=Date.now();current=q;editor()}
function setStatus(s){current.status=s;current.updated=Date.now();save()}
function message(){var t=total(current);return 'Hola '+current.client+', te envío el presupuesto '+current.number+' de '+data.company.name+'. Trabajo: '+current.description+'. Total: '+euros(t.total)+'.'}
function shareWhatsApp(){var p=(current.phone||'').replace(/\D/g,'');var url='https://wa.me/'+(p?(p.length===9?'34'+p:p):'')+'?text='+encodeURIComponent(message());window.open(url,'_blank','noopener');}
function shareEmail(){var subject='Presupuesto '+current.number+' · '+data.company.name;location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(message()+'\n\nAdjunta el PDF que has guardado desde Imprimir / PDF.')}
function printQuote(){var d=$('docview').innerHTML;$('paper').innerHTML=d;$('paper').classList.remove('hidden');window.print();setTimeout(function(){$('paper').classList.add('hidden')},500)}
function showHistory(){view='history';var h='<h2>Historial de presupuestos</h2><input id="search" placeholder="Buscar por cliente o número" oninput="filterHistory()"><div class="tabs" style="margin:10px 0"><button class="active" onclick="filterStatus(&quot;Todos&quot;,this)">Todos</button>'+['Borrador','Enviado','Aceptado','Rechazado','Caducado'].map(function(s){return '<button onclick="filterStatus(&quot;'+s+'&quot;,this)">'+s+'</button>'}).join('')+'</div><div id="history_list">'+historyItems('Todos','')+'</div>';render(h)}
var historyStatus='Todos';
function historyItems(status,search){return data.quotes.slice().sort(function(a,b){return b.updated-a.updated}).filter(function(q){return (status==='Todos'||q.status===status)&&((q.client+' '+q.number).toLowerCase().indexOf(search.toLowerCase())>=0)}).map(function(q){return '<div class="card item"><button onclick="openQuote('+q.id+')"><b>'+esc(q.client)+'</b><br><span class="muted">'+esc(q.number)+' · '+euros(total(q).total)+'</span></button><span class="pill">'+esc(q.status)+'</span></div>'}).join('')||'<div class="empty">No hay presupuestos que coincidan.</div>'}
function filterHistory(){ $('history_list').innerHTML=historyItems(historyStatus,$('search').value)}
function filterStatus(s,b){historyStatus=s;document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');filterHistory()}
function backup(){var blob=new Blob([JSON.stringify({format:'kiwiman-presupuestos',version:2,exportedAt:new Date().toISOString(),data:data},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kiwiman-copia-'+dateToday()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(){var f=$('restore_file').files[0];if(!f){alert('Selecciona un archivo JSON.');return}var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);var d=x.data||x;if(!d.company||!Array.isArray(d.quotes))throw new Error('Formato');if(!confirm('La importación sustituirá los datos actuales de este navegador. ¿Continuar?'))return;data=d;save();alert('Copia restaurada.');home()}catch(e){alert('El archivo no parece una copia válida de Kiwiman Presupuestos.')}};r.readAsText(f)}
function startDictation(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Este navegador no ofrece dictado integrado. Puedes usar el micrófono del teclado.');return}try{recognition=new SR();recognition.lang='es-ES';recognition.continuous=true;recognition.interimResults=true;recognition.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';$('voice_text').value=s.trim()};recognition.onerror=function(e){alert('No se pudo continuar el dictado: '+e.error+'. Puedes escribir el texto o usar el micrófono del teclado.');};recognition.start()}catch(e){alert('No se pudo iniciar el micrófono. Comprueba los permisos del navegador.')}}
function stopDictation(){if(recognition){try{recognition.stop()}catch(e){}recognition=null}}
function useDictation(){var t=$('voice_text').value.trim();if(!t)return alert('Primero dicta o escribe algo.');var d=$('q_desc');d.value=(d.value?d.value+'\n':'')+t}
window.home=home;window.setup=setup;window.settings=settings;window.saveSettings=saveSettings;window.newQuote=newQuote;window.openQuote=openQuote;window.addLine=addLine;window.removeLine=removeLine;window.saveQuote=saveQuote;window.cancelEditor=cancelEditor;window.editCurrent=editCurrent;window.duplicateCurrent=duplicateCurrent;window.setStatus=setStatus;window.printQuote=printQuote;window.shareWhatsApp=shareWhatsApp;window.shareEmail=shareEmail;window.showHistory=showHistory;window.filterHistory=filterHistory;window.filterStatus=filterStatus;window.backup=backup;window.restore=restore;window.startDictation=startDictation;window.stopDictation=stopDictation;window.useDictation=useDictation;
load();if(!data.company)setup();else home();
})();
</script></body></html>
