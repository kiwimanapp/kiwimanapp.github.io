<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideas Hub - Tu Panel de Notas</title>
    <style>
        :root {
            --bg-fondo: #0f172a;
            --bg-tarjeta: #1e293b;
            --borde: #334155;
            --texto-principal: #f8fafc;
            --texto-secundario: #94a3b8;
            --acento: #38bdf8;
            --acento-hover: #0284c7;
            --acento-oro: #eab308;
            --rojo-borrar: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-fondo);
            color: var(--texto-principal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--borde);
            padding-bottom: 1rem;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        header h1 span {
            color: var(--acento);
        }

        .header-buttons {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn-menu {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            color: var(--texto-principal);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-menu:hover {
            border-color: var(--acento);
        }

        /* --- FORMULARIO DE ACCESO DESPLEGABLE --- */
        #login-drawer {
            display: none;
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .drawer-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--texto-secundario);
            margin-bottom: 0.4rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.6rem;
            background: #111827;
            border: 1px solid var(--borde);
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--acento);
        }

        .btn-submit {
            padding: 0.6rem 1.5rem;
            background: var(--acento);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:hover {
            background: var(--acento-hover);
        }

        #login-status {
            font-size: 0.85rem;
            margin-top: 0.75rem;
            color: var(--acento-oro);
        }

        /* --- BARRA DE HERRAMIENTAS --- */
        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .btn-tool {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            color: var(--texto-principal);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-tool:hover {
            border-color: var(--acento);
            background: rgba(56, 189, 248, 0.05);
        }

        /* --- TABLERO DE POST-ITS --- */
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .postit {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-top: 4px solid var(--acento);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            min-height: 200px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .postit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--texto-secundario);
            margin-bottom: 0.75rem;
        }

        .btn-delete-note {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .btn-delete-note:hover {
            opacity: 1;
        }

        .postit-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .postit-body textarea {
            width: 100%;
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--texto-principal);
            resize: none;
            font-size: 0.95rem;
            line-height: 1.4;
            outline: none;
        }

        .postit-body img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 0.25rem;
            border: 1px solid var(--borde);
        }

        /* Móvil */
        @media(max-width: 480px) {
            .toolbar .btn-tool {
                flex-grow: 1;
                justify-content: center;
            }
            .drawer-grid {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nube de <span>Ideas</span></h1>
            <div class="header-buttons">
                <span id="user-display" style="font-size: 0.85rem; color: var(--texto-secundario);"></span>
                <button class="btn-menu" id="btn-toggle-login">🔑 Iniciar Sesión</button>
            </div>
        </header>

        <div id="login-drawer">
            <div class="drawer-grid">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu-correo@gmail.com">
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <button class="btn-submit" id="btn-manual-login">Conectar</button>
            </div>
            <div id="login-status"></div>
        </div>

        <div class="toolbar">
            <button class="btn-tool" id="tool-text">📝 Nueva Nota</button>
            <button class="btn-tool" id="tool-photo">📷 Subir Foto</button>
            <button class="btn-tool" id="tool-draw">🎨 Dibujar Idea</button>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
        </div>

        <div class="board" id="notes-board">
            <p style="grid-column: 1/-1; text-align:center; color:var(--texto-secundario); padding: 2rem;">Sincronizando con la nube...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, updateDoc, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tus credenciales de Ideas-hub
        const firebaseConfig = {
            apiKey: "AIzaSyC3WTBm1jjukBigbqGoYam6mfbbUHbo7I0",
            authDomain: "ideas-hub-b052c.firebaseapp.com",
            projectId: "ideas-hub-b052c",
            storageBucket: "ideas-hub-b052c.firebasestorage.app",
            messagingSenderId: "343815956768",
            appId: "1:343815956768:web:a8a663b4d0f23af0b88f45"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let unsubscribeNotes = null;

        // --- MANEJO DE SESIÓN ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-display').textContent = `Conectado: ${user.email}`;
                listenToNotes();
            } else {
                // Si abres la web y no hay sesión activa, entra solo usando tu cuenta por defecto
                try {
                    await signInWithEmailAndPassword(auth, "kiwimanapp@gmail.com", "Noelia19");
                } catch (error) {
                    console.error("Error en login automático:", error);
                }
            }
        });

        // Mostrar / Ocultar el formulario de login de arriba
        const drawer = document.getElementById('login-drawer');
        document.getElementById('btn-toggle-login').addEventListener('click', () => {
            drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
        });

        // Ejecutar login manual desde el botón del formulario desplegado
        document.getElementById('btn-manual-login').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const statusDiv = document.getElementById('login-status');
            
            if(!email || !pass) {
                statusDiv.textContent = "Por favor, rellena ambos campos.";
                return;
            }

            try {
                statusDiv.textContent = "Conectando...";
                if (unsubscribeNotes) unsubscribeNotes(); // Limpiar escucha previa
                await signInWithEmailAndPassword(auth, email, pass);
                statusDiv.textContent = "¡Sesión cambiada con éxito!";
                setTimeout(() => { drawer.style.display = 'none'; statusDiv.textContent = ''; }, 1500);
            } catch (error) {
                statusDiv.textContent = "Error: Datos incorrectos o fallo de conexión.";
            }
        });

        // --- ESCUCHA DE FIRESTORE EN TIEMPO REAL ---
        function listenToNotes() {
            const q = query(
                collection(db, "notes"), 
                where("userId", "==", currentUser.uid),
                orderBy("createdAt", "desc")
            );

            unsubscribeNotes = onSnapshot(q, (snapshot) => {
                const board = document.getElementById('notes-board');
                board.innerHTML = '';

                if (snapshot.empty) {
                    board.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:var(--texto-secundario); padding: 2rem;">No hay notas todavía. ¡Crea una desde la barra superior!</p>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const note = docSnap.data();
                    const noteId = docSnap.id;
                    
                    const postit = document.createElement('div');
                    postit.className = 'postit';
                    
                    if(note.type === 'draw') postit.style.borderTopColor = 'var(--acento-oro)';
                    if(note.type === 'photo') postit.style.borderTopColor = '#10b981';

                    let bodyContent = '';
                    if (note.type === 'text') {
                        bodyContent = `<textarea data-id="${noteId}" placeholder="Escribe tu idea aquí...">${note.content}</textarea>`;
                    } else {
                        bodyContent = `<img src="${note.content}"><p style="font-size:0.8rem; margin-top:0.5rem; color:var(--texto-secundario)">${note.caption || ''}</p>`;
                    }

                    postit.innerHTML = `
                        <div class="postit-header">
                            <span>${note.date}</span>
                            <button class="btn-delete-note" data-id="${noteId}">🗑️</button>
                        </div>
                        <div class="postit-body">${bodyContent}</div>
                    `;

                    if(note.type === 'text') {
                        postit.querySelector('textarea').addEventListener('change', (e) => {
                            updateDoc(doc(db, "notes", noteId), { content: e.target.value });
                        });
                    }

                    postit.querySelector('.btn-delete-note').addEventListener('click', async (e) => {
                        if (confirm('¿Seguro que deseas eliminar esta nota?')) {
                            const id = e.target.getAttribute('data-id');
                            await deleteDoc(doc(db, "notes", id));
                        }
                    });

                    board.appendChild(postit);
                });
            });
        }

        // --- ACCIONES DEL PANEL ---

        // Nota de Texto
        document.getElementById('tool-text').addEventListener('click', async () => {
            await addDoc(collection(db, "notes"), {
                userId: currentUser.uid,
                type: 'text',
                content: '',
                date: new Date().toLocaleDateString('es-ES'),
                createdAt: new Date().getTime()
            });
        });

        // Foto en Base64
        document.getElementById('tool-photo').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                await addDoc(collection(db, "notes"), {
                    userId: currentUser.uid,
                    type: 'photo',
                    content: e.target.result, 
                    caption: file.name,
                    date: new Date().toLocaleDateString('es-ES'),
                    createdAt: new Date().getTime()
                });
            };
            reader.readAsDataURL(file);
        });

        // Canvas de Dibujo
        document.getElementById('tool-draw').addEventListener('click', () => {
            const modal = document.createElement('div');
            modal.style = "position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.95); z-index:1000; display:flex; justify-content:center; align-items:center; flex-direction:column; padding:1rem;";
            modal.innerHTML = `
                <div style="background:var(--bg-tarjeta); padding:1.5rem; border-radius:16px; border:1px solid var(--borde); text-align:center; width:100%; max-width:440px;">
                    <h3 style="margin-bottom:1rem; color:var(--acento-oro)">Dibuja tu idea</h3>
                    <canvas id="modal-canvas" width="400" height="300" style="background:#090d16; border-radius:8px; border:1px solid var(--borde); width:100%; touch-action:none;"></canvas>
                    <div style="display:flex; justify-content:space-between; margin-top:1.25rem; gap:1rem;">
                        <button style="flex:1; padding:0.6rem; background:transparent; border:1px solid var(--borde); color:var(--texto-secundario); border-radius:8px; cursor:pointer;" id="btn-canvas-cancel">Cancelar</button>
                        <button class="btn-submit" id="btn-canvas-save" style="flex:1; padding:0.6rem;">Guardar Nota</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const canvas = document.getElementById('modal-canvas');
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            let drawing = false;

            function startDraw(e) { drawing = true; draw(e); }
            function endDraw() { drawing = false; ctx.beginPath(); }
            
            function draw(e) {
                if (!drawing) return;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                ctx.lineTo((clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo((clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY);
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
            canvas.addEventListener('touchend', endDraw);
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });

            document.getElementById('btn-canvas-cancel').onclick = () => modal.remove();
            
            document.getElementById('btn-canvas-save').onclick = async () => {
                const dataURL = canvas.toDataURL();
                await addDoc(collection(db, "notes"), {
                    userId: currentUser.uid,
                    type: 'draw',
                    content: dataURL, 
                    caption: 'Dibujo manual',
                    date: new Date().toLocaleDateString('es-ES'),
                    createdAt: new Date().getTime()
                });
                modal.remove();
            };
        });
    </script>
</body>
</html>
