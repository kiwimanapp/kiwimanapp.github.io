    let questions = [...allQuestions].sort(() => 0.5 - Math.random()).slice(0, 20);
    let index = 0;
    let score = 0;

    function showQuestion() {
        const q = questions[index];
        document.getElementById('progress').innerText = `Pregunta ${index + 1} de ${questions.length}`;
        document.getElementById('question').innerText = q.q;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        q.o.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        const q = questions[index];
        const buttons = document.getElementById('options').children;
        if (selected === q.a) {
            buttons[selected].classList.add('correct');
            score++;
        } else {
            buttons[selected].classList.add('wrong');
            buttons[q.a].classList.add('correct');
        }
        for(let btn of buttons) btn.disabled = true;
        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        feedback.innerHTML = `<strong>Explicación:</strong> ${q.e}`;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        index++;
        if (index < questions.length) showQuestion();
        else showResults();
    }

    function showResults() {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('result-ui').style.display = 'block';
        document.getElementById('score-text').innerText = `Has acertado ${score} de ${questions.length}`;
    }

    showQuestion();
